components:
  schemas:
    AccessTypeEnum:
      enum:
      - view
      - download
      - print
      - share
      type: string
      description: |-
        * `view` - Visualización
        * `download` - Descarga
        * `print` - Impresión
        * `share` - Compartir
    ActionEnum:
      enum:
      - create
      - read
      - update
      - delete
      - export
      - sign
      type: string
      description: |-
        * `create` - Crear
        * `read` - Leer
        * `update` - Actualizar
        * `delete` - Eliminar
        * `export` - Exportar
        * `sign` - Firmar
    ActionTypeEnum:
      enum:
      - CREATE
      - READ
      - UPDATE
      - DELETE
      - EXPORT
      - LOGIN
      - LOGOUT
      - PASSWORD_CHANGE
      - PERMISSION_CHANGE
      - SIGN
      - DOWNLOAD
      type: string
      description: |-
        * `CREATE` - Crear
        * `READ` - Leer
        * `UPDATE` - Actualizar
        * `DELETE` - Eliminar
        * `EXPORT` - Exportar
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `PASSWORD_CHANGE` - Cambio de Contraseña
        * `PERMISSION_CHANGE` - Cambio de Permisos
        * `SIGN` - Firma Digital
        * `DOWNLOAD` - Descarga

openapi: 3.0.3
info:
  title: CliniDocs API
  version: 1.0.0
  description: Sistema de Gestión Documental de Historias Clínicas - API Documentation
paths:
  /api/audit/:
    get:
      operationId: audit_list
      description: |-
        ViewSet para consultar logs de auditoría (solo lectura)
        Solo admins pueden ver logs
      parameters:
      - in: query
        name: action_type
        schema:
          type: string
          title: Tipo de acción
          enum:
          - CREATE
          - DELETE
          - DOWNLOAD
          - EXPORT
          - LOGIN
          - LOGOUT
          - PASSWORD_CHANGE
          - PERMISSION_CHANGE
          - READ
          - SIGN
          - UPDATE
        description: |-
          * `CREATE` - Crear
          * `READ` - Leer
          * `UPDATE` - Actualizar
          * `DELETE` - Eliminar
          * `EXPORT` - Exportar
          * `LOGIN` - Login
          * `LOGOUT` - Logout
          * `PASSWORD_CHANGE` - Cambio de Contraseña
          * `PERMISSION_CHANGE` - Cambio de Permisos
          * `SIGN` - Firma Digital
          * `DOWNLOAD` - Descarga
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: response_status
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: string
          format: uuid
      tags:
      - Audit
      security:
      - jwtAuth: []
      - Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogListList'
          description: ''
  /api/audit/{id}/:
    get:

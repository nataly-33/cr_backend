<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .header {
            background-color: #2563eb;
            color: white;
            padding: 20px;
            border-radius: 5px 5px 0 0;
            text-align: center;
        }
        .content {
            background-color: white;
            padding: 20px;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        .footer {
            background-color: #f0f0f0;
            padding: 15px;
            border-radius: 0 0 5px 5px;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{% block header %}Sistema de Notificaciones{% endblock %}</h2>
        </div>
        
        <div class="content">
            {% block main_content %}{% endblock %}
        </div>
        
        <div class="footer">
            <p>Este es un email automático de Clinical Records.</p>
            <p>No responda a este email directamente.</p>
            <p>&copy; 2025 Clinical Records. Todos los derechos reservados.</p>
        </div>
    </div>
</body>
</html>
